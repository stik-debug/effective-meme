{% extends "base.html" %}
{% block title %}Verify Phone - Chama App{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-check text-primary fs-1"></i>
          <h4 class="mt-2">Verify Your Phone</h4>
          <p class="text-muted small">We sent a 6-digit code to<br><strong>{{ phone }}</strong></p>
        </div>
        {% if debug_otp %}
        <div class="alert alert-warning small">
          <strong>Simulation mode:</strong> Your code is <code class="fs-5">{{ debug_otp }}</code>
        </div>
        {% endif %}
        <form method="POST">
          <input type="hidden" name="action" value="verify">
          <div class="mb-3">
            <label class="form-label">Enter 6-digit code</label>
            <input type="text" name="code" class="form-control form-control-lg text-center" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required autofocus style="letter-spacing:0.4em;font-size:1.5rem;">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Verify & Create Account</button>
        </form>
        <form method="POST" class="mt-3">
          <input type="hidden" name="action" value="resend">
          <button type="submit" class="btn btn-outline-secondary w-100 btn-sm">Resend code</button>
        </form>
        <div class="text-center mt-3"><small class="text-muted">Wrong number? <a href="{{ url_for('register') }}">Start over</a></small></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
