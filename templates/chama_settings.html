{% extends "base.html" %}
{% block title %}Settings - {{ chama.name }}{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb">
<li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Home</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('chama_detail', chama_id=chama.id) }}">{{ chama.name }}</a></li>
<li class="breadcrumb-item active">Settings</li>
</ol></nav>
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<h4 class="mb-4"><i class="bi bi-gear"></i> Chama Settings</h4>
<form method="POST">
<div class="mb-3"><label class="form-label">Description</label>
<textarea name="description" class="form-control" rows="2">{{ chama.description or '' }}</textarea></div>
<div class="mb-3"><label class="form-label">Monthly Amount</label>
<input type="number" name="contribution_amount" class="form-control" value="{{ chama.contribution_amount }}" required></div>
<div class="mb-3"><label class="form-label">Due Day</label>
<input type="number" name="contribution_day" class="form-control" value="{{ chama.contribution_day }}" min="1" max="28"></div>
<div class="mb-3"><label class="form-label">Currency</label>
<select name="currency" class="form-select">
<option value="KES" {% if chama.currency=='KES' %}selected{% endif %}>KES</option>
<option value="UGX" {% if chama.currency=='UGX' %}selected{% endif %}>UGX</option>
<option value="USD" {% if chama.currency=='USD' %}selected{% endif %}>USD</option>
</select></div>
<div class="mb-3"><label class="form-label">Loan Interest %</label>
<input type="number" name="loan_interest_rate" class="form-control" value="{{ chama.loan_interest_rate }}" step="0.5"></div>
<div class="mb-3"><label class="form-label">Max Loan Multiplier</label>
<input type="number" name="max_loan_multiplier" class="form-control" value="{{ chama.max_loan_multiplier }}" step="0.5"></div>
<div class="mb-3"><label class="form-label">Fine Amount</label>
<input type="number" name="fine_amount" class="form-control" value="{{ chama.fine_amount }}"></div>
<div class="mb-3"><label class="form-label">Fine Grace Days</label>
<input type="number" name="fine_grace_days" class="form-control" value="{{ chama.fine_grace_days }}"></div>
<button type="submit" class="btn btn-primary w-100">Save Settings</button>
</form>
</div></div></div></div>
{% endblock %}
